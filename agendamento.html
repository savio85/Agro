<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/agenda.css">
    <title>AgroTech</title>
</head>

<body>
    <header class="top-header">
        <button class="botao-menu"><i class="fa-solid fa-bars"></i></button>
        <h1 class="nome-empresa">AgroTech</h1>
    </header>

    <nav class="menu-lateral">
        <ul>
            <li>
                <a href="index.html">
                    <i class="fa-solid fa-house"></i>
                    Home 
                </a>
            </li>
            <li>
                <a href="cadastro.html">
                    <i class="fa-solid fa-address-book"></i>
                    Cadastrar
                </a>
            </li>
            <li>
                <a href="pesquisa.html">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    Pesquisar
                </a>
            </li>
            <li>
                <a href="agendamento.html">
                    <i class="fa-solid fa-calendar"></i>
                    Agendar 
                </a>
            </li>
           
        </ul>
    </nav>

    <div class="background"></div>
    <main class="conteudo">
        <div class="container">
        <h2>Agendamento de Visita</h2>
        <form id="agendaForm">
            <label for="cliente">Selecionar Cliente:</label>
            <select id="cliente" name="cliente">
                <option value="">Escolha um cliente</option>
            </select>
            <div class="error" id="clienteError">Por gentileza, selecionar um cliente.</div>

            <label for="datahora">Data e Hora da Visita:</label>
            <input type="datetime-local" id="datahora" name="datahora">
            <div class="error" id="datahoraError">Por gentileza, selecionar data e hora.</div>

            <button type="submit">Agendar</button>
        </form>
        <div class="results" id="appointments">
            <!-- Agendamentos aparecerão aqui -->
        </div>
    </div>

    </main>
    <footer>
        <p>Created By &copy; <a href="https://github.com/savio85" target="_blank">Savio Junior</a></p>
    </footer>

</body>
<script src="scripts/navbar.js"></script>
<script src="scripts/agenda.js"></script>
</html>
