<body>

        <div class="background"></div>
        <main class="conteudo">
            <div class="container">
        <h2>Cadastro de Pessoa</h2>
        <form id="cadastroForm">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome">
            <div class="error" id="nomeError">Por gentileza, preencher esse campo.</div>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <div class="error" id="emailError">Por gentileza, preencher esse campo.</div>

            <label for="telefone">Contato de Telefone:</label>
            <input type="tel" id="telefone" name="telefone">
            <div class="error" id="telefoneError">Por gentileza, preencher esse campo.</div>

            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" name="endereco">
            <div class="error" id="enderecoError">Por gentileza, preencher esse campo.</div>

            <button type="submit" class="butao-cadastro">Cadastrar</button>
        </form>
    </div>

        </main>
    </body>
